project:
  type: book
  output-dir: docs
  pre-render:
    - python tools/prepare_exam_figures.py
    - python tools/prepare.py
    - python "Problem Bank/tools/prepare_bank.py"
  post-render:
    - python tools/postrender.py
  resources:
    - "Unit 1/**/assets/**"
    - "Unit 1/**/data/**"
    - site/assets/
    - "Problem Bank/assets/"
    - "Problem Bank/catalog.json"
    - "Problem Bank/original/"
    - .nojekyll
book:
  title: "AP Statistics: Learning from Data"
  author: "Chun Li · Maple Hill School"
  site-url: https://lichunubc.github.io/ap_statistics/
  search: true
  page-navigation: true
  sidebar:
    title: "Maple Hill School"
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Unit 1/unit-1.qmd"
      chapters:
        - "Unit 1/Topic 1.1/topic-1-1.qmd"
        - "Unit 1/Topic 1.2/topic-1-2.qmd"
        - "Unit 1/Topic 1.3/topic-1-3.qmd"
        - "Unit 1/Topic 1.4/topic-1-4.qmd"
        - "Unit 1/Topic 1.5/topic-1-5.qmd"
        - "Unit 1/Topic 1.6/topic-1-6.qmd"
        - "Unit 1/Topic 1.7/topic-1-7.qmd"
        - "Unit 1/Topic 1.8/topic-1-8.qmd"
        - "Unit 1/Topic 1.9/topic-1-9.qmd"
        - "Unit 1/Topic 1.10/topic-1-10.qmd"
        - "Unit 1/Shared/practice.qmd"
    - "Unit 2/unit-2.qmd"
    - "Unit 3/unit-3.qmd"
    - "Unit 4/unit-4.qmd"
    - "Unit 5/unit-5.qmd"
    - "Problem Bank/practice.qmd"
    - resources.qmd
  page-footer:
    left: "Maple Hill School · Chun Li"
    right: "AP Statistics · Interactive course book"
filters:
  - "Problem Bank/practice-filter.lua"
  - "Problem Bank/original-practice-filter.lua"
format:
  html:
    theme: default
    mainfont: "system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
    fontsize: 1.05em
    css:
      - "Unit 1/Shared/assets/site.css"
      - "Unit 1/Topic 1.1/assets/foundations.css"
      - "Unit 1/Topic 1.3/assets/categorical-tables.css"
      - "Unit 1/Topic 1.4/assets/categorical-charts.css"
      - "Unit 1/Topic 1.2/assets/variables.css"
      - site/assets/navigation.css
      - site/assets/student-presentation.css
      - "Problem Bank/assets/practice.css"
      - "Problem Bank/assets/original-practice.css"
      - "Unit 1/Topic 1.7/assets/summary17.css"
      - "Unit 1/Topic 1.8/assets/box18.css"
      - "Unit 1/Topic 1.9/assets/compare19.css"
      - "Unit 1/Topic 1.10/assets/study110.css"
    toc: true
    toc-depth: 2
    number-sections: false
    html-math-method: mathml
    code-copy: true
    include-after-body:
      - "Unit 1/Shared/assets/footer.html"
      - site/assets/navigation.html
      - site/assets/student-presentation.html
      - "Problem Bank/assets/footer.html"
      - "Problem Bank/assets/original-footer.html"
      - "Unit 1/Topic 1.7/assets/summary17-footer.html"
      - "Unit 1/Topic 1.8/assets/box18-footer.html"
      - "Unit 1/Topic 1.9/assets/compare19-footer.html"
      - "Unit 1/Topic 1.10/assets/study110-footer.html"
lang: en
