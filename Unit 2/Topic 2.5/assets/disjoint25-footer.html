<script>
(function(){
 const css=Array.from(document.querySelectorAll('link[rel="stylesheet"]')).find(e=>e.href.includes('/disjoint25.css'));
 if(!css)return;
 const script=document.createElement('script');
 script.src=css.href.replace(/disjoint25\.css(?:\?.*)?$/,'disjoint25.js');
 script.defer=true;document.body.appendChild(script);
})();
</script>
