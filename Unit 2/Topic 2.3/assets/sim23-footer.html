<script>
(function(){
 const css=Array.from(document.querySelectorAll('link[rel="stylesheet"]')).find(e=>e.href.includes('/sim23.css'));
 if(!css)return;
 const script=document.createElement('script');
 script.src=css.href.replace(/sim23\.css(?:\?.*)?$/,'sim23.js');
 script.defer=true;document.body.appendChild(script);
})();
</script>
