name: Build and publish Quarto book
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ap-statistics-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.38'
      - name: Render the Quarto book
        run: quarto render
      - name: Check JavaScript syntax
        run: for file in assets/*.js; do node --check "$file"; done
      - name: Install browser test tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Check data, links, and desktop/mobile interactions
        run: |
          python tools/check_site.py
          python tools/check_foundations.py
      - name: Save rendered HTML in the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m 'Render checked Quarto site [skip ci]'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: site-and-checks
          path: |
            docs
            qa
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Publish site
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Verify published chapter
        if: steps.deployment.outcome == 'success'
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PYTHON'
          import os,time,urllib.request
          base=os.environ['SITE_URL'].rstrip('/')
          assert base.startswith('https://lichunubc.github.io/'), base
          for path,marker in [('', 'topic-1-1.html'),('topic-1-1.html','data-foundation="population"')]:
              url=base+'/'+path+'?release='+os.environ['GITHUB_SHA']
              for attempt in range(16):
                  try:
                      with urllib.request.urlopen(url,timeout=15) as response:
                          text=response.read().decode('utf-8')
                          assert response.status==200 and marker in text
                      print('Verified public page:',base+'/'+path)
                      break
                  except Exception:
                      if attempt==15: raise
                      time.sleep(5)
          PYTHON
      - name: Explain the one-time setup
        if: steps.pages.outcome != 'success'
        run: |
          echo '## Site built; Pages needs one-time setup' >> "$GITHUB_STEP_SUMMARY"
          echo 'Open Settings > Pages and set Source to GitHub Actions, then rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'GitHub Free requires a public repository for Pages. This workflow does not change repository visibility.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Rendered HTML is in docs/ and the site-and-checks build artifact.' >> "$GITHUB_STEP_SUMMARY"
