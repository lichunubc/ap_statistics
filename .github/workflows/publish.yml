name: Build and publish Quarto book
on:
  push:
    branches: [main, 'preview/**']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ap-statistics-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax before rendering
        run: python -m compileall -q tools site "Unit 1" "Unit 2" "Problem Bank"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.38'
      - name: Install question-image renderer
        run: python -m pip install PyMuPDF==1.26.7
      - name: Render the Quarto book
        run: quarto render
      - name: Check JavaScript syntax
        run: find "Unit 1" site "Problem Bank" -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Install browser test tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Check data, links, and desktop/mobile interactions
        run: python tools/check_all.py
      - name: Save rendered HTML in the repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'main changed during validation; do not publish stale output.' >&2
            exit 1
          fi
          git add docs
          git add -- "Unit 1/Topic 1.6/assets/exam" "Unit 1/Topic 1.7/assets/exam" "Unit 1/Topic 1.8/assets/exam" "Unit 1/Topic 1.9/assets/exam" "Unit 1/Topic 1.11/assets/exam" project/released-exam-figures-provenance.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save checked site and original question images [skip ci]'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-and-checks
          path: |
            docs
            qa
            Unit 1/**/assets/exam/
            project/released-exam-figures-provenance.json
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check Pages configuration
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Publish site
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Verify published chapter
        if: steps.deployment.outcome == 'success'
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python tools/check_live.py
      - name: Install live navigation browser
        if: steps.deployment.outcome == 'success'
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Verify live unit navigation
        if: steps.deployment.outcome == 'success'
        env:
          NAVIGATION_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python site/tests/check_navigation.py
      - name: Verify live problem bank
        if: steps.deployment.outcome == 'success'
        env:
          BANK_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python "Problem Bank/tests/check_bank.py"
      - name: Verify live student presentation
        if: steps.deployment.outcome == 'success'
        env:
          PRESENTATION_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python site/tests/check_student_presentation.py
      - name: Verify live random sampling lesson
        if: steps.deployment.outcome == 'success'
        env:
          SAMPLING111_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python "Unit 1/Topic 1.11/tests/check_sampling111_browser.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-release-verification
          path: qa
          if-no-files-found: ignore
          retention-days: 7
      - name: Explain the one-time setup
        if: steps.pages.outcome != 'success'
        run: |
          echo '## Site built; Pages needs one-time setup' >> "$GITHUB_STEP_SUMMARY"
          echo 'Open Settings > Pages and set Source to GitHub Actions, then rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'GitHub Free requires a public repository for Pages. This workflow does not change repository visibility.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Rendered HTML is in docs/ and the site-and-checks build artifact.' >> "$GITHUB_STEP_SUMMARY"
