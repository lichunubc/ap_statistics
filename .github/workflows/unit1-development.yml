name: Unit 1 development snapshot
on:
  push:
    branches: [development/topic-1-2-unit-1]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.38'
      - name: Package pinned runtime for offline validation
        run: |
          install_root="$(dirname "$(dirname "$(readlink -f "$(command -v quarto)")")")"
          test -f "$install_root/bin/quarto"
          tar -czf quarto-runtime.tar.gz -C "$install_root" .
      - uses: actions/upload-artifact@v4
        with:
          name: quarto-runtime
          path: quarto-runtime.tar.gz
          retention-days: 1
