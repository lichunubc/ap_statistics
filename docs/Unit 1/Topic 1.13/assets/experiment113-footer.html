<script>
(function () {
 const css=Array.from(document.querySelectorAll('link[rel="stylesheet"]')).find(e=>e.href.includes('/experiment113.css'));
 if(!css)return;
 const script=document.createElement('script');
 script.src=css.href.replace(/experiment113\.css(?:\?.*)?$/,'experiment113.js');
 script.defer=true;document.body.appendChild(script);
})();
</script>
