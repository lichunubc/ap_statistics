<script>
(function () {
 const css=Array.from(document.querySelectorAll('link[rel="stylesheet"]')).find(e=>e.href.includes('/bias112.css'));
 if(!css)return;
 const script=document.createElement('script');
 script.src=css.href.replace(/bias112\.css(?:\?.*)?$/,'bias112.js');
 script.defer=true;document.body.appendChild(script);
})();
</script>
